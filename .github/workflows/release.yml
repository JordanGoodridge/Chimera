# Release builds: on a version tag (v*), build the game and the dedicated
# server for Windows and Linux, zip each with dist/README.txt and attach
# them to a GitHub Release. Nothing from other games is packaged: the game
# loads them from the player's own install at run time.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v0.1.0-playtest1)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            exe: .exe
          - os: ubuntu-latest
            platform: linux
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # Tags too, so `git describe` (apps/cs_source/build.rs) names the release tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        # The game, then the dedicated server without the presentation
        # alone (no render or audio code: apps/cs_source_server uses the app
        # without its `present` feature).
        shell: bash
        run: |
          cargo build --release --locked -p cs_source_app --bin cs_source
          cargo build --release --locked -p cs_source_server --bin cs_source_server
      - name: Package
        shell: bash
        run: |
          name="LuckerParty-${TAG}-${{ matrix.platform }}"
          mkdir -p "pkg/$name"
          cp "target/release/cs_source${{ matrix.exe }}" "target/release/cs_source_server${{ matrix.exe }}" "pkg/$name/"
          cp dist/README.txt "pkg/$name/README.txt"
          cp LICENSE-MIT LICENSE-APACHE "pkg/$name/" 2>/dev/null || true
          cd pkg
          if [ "${{ matrix.platform }}" = windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            strip "$name/cs_source" "$name/cs_source_server"
            zip -qr "$name.zip" "$name"
          fi
          ls -l "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: pkg/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --title "Lucker Party $TAG" \
                 --notes "Playtest build. Needs Counter-Strike: Source installed through Steam; see README.txt in the zip."
          gh release upload "$TAG" zips/*.zip -R "$GITHUB_REPOSITORY" --clobber
