[package]
name = "chimera_net"
version = "0.1.0"
description = "Network play: transport, replication, prediction; games register what they replicate"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's base, the simulation's map and frameworks, Bevy, physics
# and the network crates; never the presentation (`chimera_present`),
# Source's logic, `mashup` or a game (checks/tests/it/architecture.rs checks it):
# a game and Source's logic register what they replicate (`NetAppExt`).
# Same versions and features as the game's (workspace dependencies), so
# `cargo test -p chimera_net` reuses the game's builds.
[dependencies]
chimera_core.workspace = true
chimera_world.workspace = true
chimera_sim.workspace = true
avian3d.workspace = true
bevy.workspace = true
bevy_replicon.workspace = true
bevy_replicon_renet.workspace = true
# Netcode's client protocol, for our UDP client transport with
# `net_fakelag`/`net_fakeloss` (net::udp); the one bevy_replicon_renet uses.
renetcode.workspace = true
# UPnP port mapping for hosts (`net_upnp`, net::upnp); sync client, no TLS.
igd-next.workspace = true
postcard.workspace = true
serde.workspace = true
# The map file's hash in the connect handshake; compressed downloads.
sha2.workspace = true
bzip2.workspace = true
workspace-hack.workspace = true

# The integration tests (tests/it/): prediction and replication on `NetSim`
# with the engine's base alone, nothing of a game.
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Bevy as a dynamic library, as the game's `dev` (which turns this on):
# `cargo test -p chimera_net --features dev` shares the game's Bevy build.
dev = ["chimera_core/dev", "chimera_world/dev", "chimera_sim/dev"]

[dev-dependencies]
# The presentation's Bevy and Avian features, for this crate's own tests only
# (the dedicated servers build without them): `cargo test -p <crate>` shares
# the clients' builds of Bevy instead of building its own (hakari.toml).
bevy = { workspace = true, features = ["default", "wav"] }
avian3d = { workspace = true, features = ["debug-plugin", "bevy_picking", "bevy_scene"] }
