[package]
name = "chimera_client"
version = "0.1.0"
description = "The client shell: window, input, camera, console UI, HUD base, VGUI-like widgets, debug tools, network glue"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's crates: its base, map data (HUD layouts, schemes), the
# simulation's frameworks (weapons, movement), the presentation (render
# passes, sound) and the network; never `mashup`, Source's logic or a game
# (checks/tests/it/architecture.rs checks it). Same versions and features as the
# game's (workspace dependencies), so `cargo test -p chimera_client` reuses
# the game's builds.
[dependencies]
chimera_core.workspace = true
chimera_world.workspace = true
chimera_sim.workspace = true
chimera_present.workspace = true
chimera_net.workspace = true
avian3d.workspace = true
bevy.workspace = true
# HUD glyphs rasterized and placed as Source's HUD does (`hud_text`).
ab_glyph.workspace = true
# The debug UI and the inspector (`debug_ui`, `debug`).
bevy-inspector-egui.workspace = true
bevy_egui.workspace = true
# Voice chat (`voice`): the microphone and speakers, the Opus codec.
cpal.workspace = true
mousiki.workspace = true
# The console's copy and paste.
arboard.workspace = true
dirs.workspace = true
image.workspace = true
serde.workspace = true
# `--views` files and bench results (`capture`).
serde_json.workspace = true
workspace-hack.workspace = true

# The integration tests (tests/it/): the shell's parts on the headless
# harness with the engine's base alone.
[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Bevy as a dynamic library and the remote protocol, as the game's `dev`
# (which turns this on): `cargo test -p chimera_client --features dev`
# shares the game's Bevy build.
dev = [
    "chimera_core/dev",
    "chimera_world/dev",
    "chimera_sim/dev",
    "chimera_present/dev",
    "chimera_net/dev",
]
# Every system as a span in a Chrome trace (the game's `profile`).
profile = ["chimera_core/profile"]
