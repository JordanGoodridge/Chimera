[package]
name = "chimera_core"
version = "0.1.0"
description = "The engine's stable base: shared vocabulary, console, slots, metrics"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# Bevy and physics (and the formats, for `mount`), never `mashup` or a
# game (checks/tests/it/architecture.rs checks it). Same versions and features as the game's (workspace
# dependencies), so `cargo test -p chimera_core` reuses the game's builds.
[dependencies]
# Bevy's development features (`dev`, `profile`).
chimera_dev = { workspace = true, optional = true }
avian3d.workspace = true
bevy.workspace = true
postcard.workspace = true
serde.workspace = true
# `mount`: the VFS and KeyValues it re-exports, `mashup.local.toml`, the
# user's settings and Steam libraries.
source_formats.workspace = true
dirs.workspace = true
toml.workspace = true
workspace-hack.workspace = true

# Where Steam is (`mount::install`: the registry's `SteamPath`).
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Per-thread hardware counters for `metrics::counters`; Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
perf-event2.workspace = true

# Per-thread CPU time (`clock_gettime(CLOCK_THREAD_CPUTIME_ID)`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Bevy as a dynamic library, as the game's `dev` (which turns this on):
# `cargo test -p chimera_core --features dev` shares the game's Bevy build.
# Every crate's `dev` comes here; the Bevy features are `chimera_dev`'s
# (left out of the workspace-hack: chimera/dev/Cargo.toml).
dev = ["dep:chimera_dev", "chimera_dev/dev"]
# Every system as a span in a Chrome trace (the game's `profile`).
profile = ["dep:chimera_dev", "chimera_dev/profile"]
