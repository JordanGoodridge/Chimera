foldhash = { version = "0.2", default-features = false, features = ["std"] }
hashbrown-9067fe90e8c1f593 = { package = "hashbrown", version = "0.17", default-features = false, features = ["default-hasher", "raw-entry"] }
indexmap = { version = "2", features = ["serde"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
regex-automata = { version = "0.4" }
regex-syntax = { version = "0.8" }
serde_core = { version = "1", features = ["alloc"] }
syn-7b89eefb6aaa9bf3 = { package = "syn", version = "3", features = ["extra-traits", "fold", "full", "visit"] }
syn-f595c2ba2a3f28df = { package = "syn", version = "2", features = ["extra-traits", "full", "visit", "visit-mut"] }
toml_datetime = { version = "1", features = ["serde"] }
toml_parser = { version = "1" }
winnow = { version = "1" }

[target.x86_64-unknown-linux-gnu.dependencies]
getrandom = { version = "0.4", default-features = false, features = ["std", "sys_rng"] }
memchr = { version = "2" }
nix = { version = "0.31", default-features = false, features = ["event", "ioctl", "signal"] }
tracing = { version = "0.1", default-features = false, features = ["log"] }
wayland-backend = { version = "0.3", default-features = false, features = ["client_system", "dlopen"] }
