[package]
name = "engine_client"
version = "0.1.0"
description = "The client shell's base: the front end's interface, fonts, HUD text, the VGUI-like widgets, key binds"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's base, map data (HUD layouts, schemes),
# Bevy; never `mashup`, `net` or a game (tests/it/architecture.rs checks
# it). Same versions and features as the game's (workspace dependencies),
# so `cargo test -p engine_client` reuses the game's builds.
[dependencies]
engine_core.workspace = true
engine_world.workspace = true
bevy.workspace = true
# HUD glyphs rasterized and placed as Source's HUD does (`hud_text`).
ab_glyph.workspace = true

[features]
# Bevy as a dynamic library, as the game's `dev` (which turns this on):
# `cargo test -p engine_client --features dev` shares the game's Bevy build.
dev = ["bevy/dynamic_linking", "bevy/bevy_remote", "engine_core/dev", "engine_world/dev"]
