[package]
name = "engine_client"
version = "0.1.0"
description = "The client shell: window, input, camera, console UI, HUD base, VGUI-like widgets, debug tools, network glue"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's crates: its base, map data (HUD layouts, schemes), the
# simulation's frameworks (weapons, movement), the presentation (render
# passes, sound) and the network; never `mashup`, Source's logic or a game
# (tests/it/architecture.rs checks it). Same versions and features as the
# game's (workspace dependencies), so `cargo test -p engine_client` reuses
# the game's builds.
[dependencies]
engine_core.workspace = true
engine_world.workspace = true
engine_sim.workspace = true
engine_present.workspace = true
engine_net.workspace = true
avian3d.workspace = true
bevy.workspace = true
# HUD glyphs rasterized and placed as Source's HUD does (`hud_text`).
ab_glyph.workspace = true
# The debug UI and the inspector (`debug_ui`, `debug`).
bevy-inspector-egui.workspace = true
bevy_egui.workspace = true
# The console's copy and paste.
arboard.workspace = true
dirs.workspace = true
image.workspace = true
serde.workspace = true
# `--views` files and bench results (`capture`).
serde_json.workspace = true

[features]
# Bevy as a dynamic library and the remote protocol, as the game's `dev`
# (which turns this on): `cargo test -p engine_client --features dev`
# shares the game's Bevy build.
dev = [
    "bevy/dynamic_linking",
    "bevy/bevy_remote",
    "engine_core/dev",
    "engine_world/dev",
    "engine_sim/dev",
    "engine_present/dev",
    "engine_net/dev",
]
# Every system as a span in a Chrome trace (the game's `profile`).
profile = ["bevy/trace_chrome"]
