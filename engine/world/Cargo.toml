[package]
name = "engine_world"
version = "0.1.0"
description = "The engine's map: neutral map data, collision, sim-side spawning"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's base and the formats, Bevy and physics; never the
# presentation (`engine_present`), `mashup` or a game
# (tests/it/architecture.rs checks it). Same versions and features as the
# game's (workspace dependencies), so `cargo test -p engine_world` reuses
# the game's builds.
[dependencies]
engine_core.workspace = true
source_formats.workspace = true
avian3d.workspace = true
bevy.workspace = true
bevy_replicon.workspace = true
half.workspace = true
image.workspace = true
serde.workspace = true

[features]
# Bevy as a dynamic library, as the game's `dev` (which turns this on):
# `cargo test -p engine_world --features dev` shares the game's Bevy build.
dev = ["bevy/dynamic_linking", "bevy/bevy_remote", "engine_core/dev"]
