# Gun Game on de_dust2 (docs/plans/active/architecture-review.md D2): every
# player for themselves up a ladder of Counter-Strike: Source's and Combat
# Arms' guns, a rung a kill; a knife death costs a rung; the first kill
# with the last gun wins. Each player is the game of the gun in hand
# (`identity = "weapon"`): a CS:S gun moves, looks and shows its HUD as
# CS:S, a Combat Arms gun (and the knife) as Combat Arms. On a CS:S map
# (or on Combat Arms' Warehouse, the pool's second map).
id = "originals:gun_game_dust2"
name = "Gun Game: Dust II"
description = "Climb a ladder of CS:S and Combat Arms guns; a knife death costs a rung; the last gun's kill wins."
players = { min = 2, max = 16 }
maps = ["cs_source:de_dust2", "combat_arms:warehouse"]
teams = "free_for_all"
time_limit = "10m"

[slots]
hud = "combat_arms"
binds = "combat_arms"
tick = "combat_arms"
bots = "combat_arms"
movement = "combat_arms:movement"
character = "combat_arms:soldier"
identity = "weapon"
weapons = ["cs_source", "combat_arms"]

[spawn]
respawn = { delay = "2s", protection = "1.5s" }
points = "far_from_enemies"
kit = ["combat_arms:m9_knife"]

[rules]
module = "chimera:ladder"
ladder = [
    "cs_source:weapon_glock",
    "combat_arms:beretta_m92fs",
    "cs_source:weapon_deagle",
    "combat_arms:mp5a4",
    "cs_source:weapon_p90",
    "combat_arms:remington_870",
    "cs_source:weapon_ak47",
    "combat_arms:m4a1",
    "combat_arms:m60",
    "cs_source:weapon_awp",
]
advance_on = "kill"
demote_on = "melee_death"
win = { kind = "ladder_end" }
