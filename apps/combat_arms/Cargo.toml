[package]
name = "combat_arms_app"
version = "0.1.0"
description = "The Combat Arms app: its game binary on Chimera (the skeleton: placeholder parts on the greybox)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The app composes Chimera and Combat Arms (with its front end, `ui`):
# the simulation, the presentation, the client shell and the network.
# Never CS:S's crates or `mashup` (checks/tests/it/architecture.rs).
[dependencies]
chimera_core.workspace = true
chimera_world.workspace = true
chimera_sim.workspace = true
chimera_net.workspace = true
chimera_present.workspace = true
chimera_client.workspace = true
combat_arms = { workspace = true, features = ["ui"] }
avian3d.workspace = true
bevy.workspace = true
workspace-hack.workspace = true

# The game.
[[bin]]
name = "combat_arms"
path = "src/main.rs"
test = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[features]
# Faster iteration: link Bevy as a dynamic library, serve the remote
# protocol. `cargo run --features dev --bin combat_arms`. Never for
# release builds.
dev = [
    "chimera_core/dev",
    "chimera_world/dev",
    "chimera_sim/dev",
    "chimera_net/dev",
    "chimera_present/dev",
    "chimera_client/dev",
    "combat_arms/dev",
]

# Profiling (docs/performance.md, "See a frame yourself"): `trace` records
# a short window of spans (`trace_capture`, `CHIMERA_TRACE_SECONDS`),
# `profile` also the whole run into a Chrome trace, `tracy` streams to
# the Tracy profiler. Slower; only for measuring.
trace = ["chimera_core/trace", "chimera_client/trace"]
profile = ["chimera_core/profile", "chimera_client/profile"]
tracy = ["chimera_core/tracy", "chimera_client/tracy"]
