# How CS:S's bullets pass things (the format: docs/weapon-data.md,
# "Penetration by material"), measured M13 (specs/cs_source/weapons.md).
# A wall passes when its thickness along the path is at most the ammo's
# power (its data's `[ammo]`) x the material's scale; each object passed
# scales the damage carried on. The class letters are the install's
# surface materials' (`gamematerial`), read from it at run time.
units = { length = 0.0254 }

# Wood: scale and damage measured.
[[material]]
class = "W"
scale = 2.0
damage = 0.6

# Metal, sand (dirt): scales measured; damage factors are not
# (UNMEASURED: halfway between wood and concrete, as players).
[[material]]
class = "M"
scale = 1.0
damage = 0.5

[[material]]
class = "D"
scale = 0.5
damage = 0.5

# Concrete: both measured.
[[material]]
class = "C"
scale = 0.4
damage = 0.25

# UNMEASURED (tile, grate, glass, plastic, ...): metal's scale and a
# halved damage.
[default]
scale = 1.0
damage = 0.5

[character]
# A fit to the measured stop cases (21-22 units per player).
cost = 21.5
damage = 0.5
# The range left beyond a player's exit is halved.
range_scale = 0.5
