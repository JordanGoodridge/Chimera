# How CS:S's bullets pass things (the format: docs/weapon-data.md,
# "Penetration by material"), measured M13 (specs/cs_source/weapons.md).
# A wall passes when its thickness along the path is at most the ammo's
# power (its data's `[ammo]`) x the material's scale; each object passed
# scales the damage carried on. The class letters are the install's
# surface materials' (`gamematerial`), read from it at run time.
units = { length = 0.0254 }

# Wood: scale and damage measured.
[[material]]
class = "W"
scale = 2.0
damage = 0.6

# Metal: scale and damage measured (2026-10-18: the AWP through an oil
# drum's 13.6-22.4-unit chords kept 0.297-0.306).
[[material]]
class = "M"
scale = 1.0
damage = 0.3

# Sand (dirt): scale and damage measured (2026-10-18: AK-47, M4A1 and
# AWP through de_dust2's 11.4 and 14.4 sand walls kept 0.297-0.301).
[[material]]
class = "D"
scale = 0.5
damage = 0.3

# Concrete: both measured.
[[material]]
class = "C"
scale = 0.4
damage = 0.25

# Damage measured 2026-10-18 (the AWP through a motion-disabled prop of
# that material, 6-20 units): tile 0.3 (inferno's potted plant), computer
# 0.45 (its TV), grate 0.99 (cs_office's fire extinguisher), plastic and
# glass (pottery) 0.5. Scales: computer 0.4 (the M4A1's 35 passes its
# 13.2-unit TV, the Deagle's 30 doesn't: 0.377-0.44); tile 0.65 and
# glass 1.0 (2026-10-18, inferno's big pot and clay oven along chords of
# 11-43 units: the Glock's 21 passes 13.4 of tile and not 14.6, the
# Deagle's 30 17.6 and not 22.4, the AK-47's 39 25.0 and not 26.4: 0.642-
# 0.676; the AK-47 passes 36.5 of pottery and not 39.0, the USP 14.8:
# 0.987-1.0); grate and plastic are only bounded below (the USP's 15
# passes 6.1 of grate) and take metal's 1.0 (UNMEASURED).
[[material]]
class = "T"
scale = 0.65
damage = 0.3

[[material]]
class = "P"
scale = 0.4
damage = 0.45

[[material]]
class = "G"
scale = 1.0
damage = 0.99

[[material]]
class = "L"
scale = 1.0
damage = 0.5

[[material]]
class = "Y"
scale = 1.0
damage = 0.5

# UNMEASURED (vent, flesh, foliage, ...): metal's scale and a halved
# damage.
[default]
scale = 1.0
damage = 0.5

[character]
# A fit to the measured stop cases (21-22 units per player).
cost = 21.5
damage = 0.5
# The range left beyond a player's exit is halved.
range_scale = 0.5

# An entity (a prop, not the world or a static prop) crossed for 24 units
# or more scales the damage by its material's factor twice: measured
# 2026-10-18 on a motion-disabled oil drum (one convex piece), 0.3 through
# chords to 23.7, 0.09 from 24.4 (24.0 went both ways); wooden static
# props 38-42 thick kept 0.6.
[entity]
twice_from = 24.0
