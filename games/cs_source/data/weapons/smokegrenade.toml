# The Smoke grenade (specs/cs_source/grenades.md): price `WeaponPrice`, carry
# limit `ammo_*_max` (spec 1); the throw, flight and effect are the
# `cs_source:grenade` hook's (games/cs_source/src/game/grenades.rs).
id = "cs_source:weapon_smokegrenade"
base = "cs_source:base"
slot = 3
# The view model's deploy.
draw = 0.6667
max_speed = 245.0
weight = 2

[buy]
price = 300

[sounds]

# Held, and drawn in flight: the `_thrown` models have no bone in common
# with the player skeleton, so the held one stands in. The view model
# holds the grenade left of the eye, like the AK.
[models]
world = "models/weapons/w_eq_smokegrenade.mdl"
view = "models/weapons/v_eq_smokegrenade.mdl"

[hud]
name = "Cstrike_WPNHUD_Smoke_Grenade"
icon = "d_smokegrenade"

[hooks."cs_source:grenade"]
effect = "smoke"
max = 1
bounce_sound = "SmokeGrenade.Bounce"
