# CS:S's ammo types: penetration power (units of a scale-1 material) and
# reach (measured M13), most rounds carried (`ammo_<type>_max`, M17), the
# box it's bought in (M19: measured box sizes; ammo costs nothing in CS:S
# today) and the HUD's ammo icon.
units = { length = 0.0254 }

# Power 39 (M13); it still passes at 4000 units, no farther limit was
# found.
[ammo."cs_source:762mm"]
power = 39.0
max_distance = inf
max = 90
box_price = 0
box_rounds = 30
hud_icon = "ammo_762"

