# CS:S's team rounds with money (`rules::rounds::RoundSettings`; the
# cvars set them after): the rule module's numbers, read with
# `rule_module::parse_settings`. Timers and start money are CS:S's
# defaults read from a fresh dedicated server over RCON (2026-10-14,
# docs/plans/active/parity-gaps.md C9); every reward and penalty measured
# on the probe server (2026-10-17, specs/cs_source/objectives.md Q5, the
# players' accounts read around each event): the round's bonuses are paid
# as the next round starts, the rest at once.

# Seconds frozen at a round's start (mp_freezetime).
freeze_time = 6.0
# Minutes a round lasts (mp_roundtime).
round_time = 2.5
# Minutes after the freeze that buying stays open (mp_buytime).
buy_time = 1.5
# mp_startmoney, and the most anyone holds.
start_money = 800
max_money = 16000
# Seconds between a round's end and the next one.
end_delay = 5.0
# The winners' bonus by elimination on a bomb map; the losers' grows by `loss_step` a consecutive loss up to
# `loss_max`.
win_bonus = 3250
loss_bonus = 1400
loss_step = 500
loss_max = 3400
kill_reward = 300
teamkill_penalty = 3300
# mp_tkpunish.
tk_punish = 0
# Objective wins: the bomb exploded; defused; time ran out on a bomb map
# with no plant (the terrorists still alive get nothing); all hostages
# rescued; time ran out on a hostage map (the counter-terrorists still
# alive get nothing); an elimination on a map without bomb targets (hostage
# maps and maps without objectives, measured on de_dust2 with its bomb
# targets removed). A draw pays nobody.
win_bomb = 3500
win_defused = 3250
win_target_saved = 3250
win_rescued = 2500
win_not_rescued = 3250
win_elimination = 3000
# 1: on a map without objectives the defenders win when time runs out (a
# draw with none); 0: the clock ends nothing there, the round goes on
# until one side is dead (CS:S, measured).
untimed_win = 0
# On a hostage map the winners also get this much for each hostage: alive
# and not rescued; led this round (counter-terrorists only, on top); and
# rescued (counter-terrorists).
hostage_alive_bonus = 150
hostage_led_bonus = 100
hostage_rescued_bonus = 850
# Every terrorist, on top of the loss bonus, when the bomb was planted and
# they lost anyway; the planter's and the defuser's own reward (none).
plant_loss_bonus = 800
planter_reward = 0
defuser_reward = 0
# The defender who first leads a hostage this round (once per hostage);
# the one whose hostage is rescued.
hostage_touch = 150
hostage_rescue = 1000
# Hurting a hostage costs this much a whole point of damage; the hit that
# kills it costs that twice over plus `hostage_kill_penalty` (either team).
hostage_hurt_penalty = 20
hostage_kill_penalty = 500
