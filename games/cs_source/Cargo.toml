[package]
name = "cs_source"
version = "0.1.0"
description = "Counter-Strike: Source: its simulation (loaders, parts, rules) on the engine"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's crates and the formats, Bevy and physics, Source's file
# readers; never `mashup` or another game, and the presentation
# (`chimera_present`), the shell and Source's logic only for `ui`
# (tests/it/architecture.rs checks it). Same versions and features
# as the game's (workspace dependencies), so `cargo test -p cs_source`
# reuses the game's builds.
[dependencies]
chimera_core.workspace = true
chimera_world.workspace = true
chimera_sim.workspace = true
# The network: the game registers its round, bomb and hostages there and
# fills its hooks (`game::net`).
chimera_net.workspace = true
source_formats.workspace = true
avian3d.workspace = true
bevy.workspace = true
bevy_replicon.workspace = true
bzip2.workspace = true
half.workspace = true
image.workspace = true
serde.workspace = true
sha2.workspace = true
vbsp.workspace = true
vmdl.workspace = true
vmt-parser.workspace = true
vtf.workspace = true
# The front end (`ui`, the `ui` feature): the client shell, the
# presentation it draws with, Source's logic (the objectives' map
# entities), the clipboard and the window icon.
chimera_client = { workspace = true, optional = true }
chimera_present = { workspace = true, optional = true }
source_logic = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
# Joining's progress (the loading dialog reads the netcode client).
bevy_replicon_renet = { workspace = true, optional = true }
workspace-hack.workspace = true

[features]
# CS:S's front end (`ui`): its menus, panels and HUD on the client shell.
# The game's client turns it on (`mashup`'s `present`); the dedicated
# server and the simulation's tests build without it.
ui = ["dep:chimera_client", "dep:chimera_present", "dep:source_logic", "dep:arboard", "dep:winit", "dep:bevy_replicon_renet"]
# Bevy as a dynamic library, as the game's `dev` (which turns this on):
# `cargo test -p cs_source --features dev` shares the game's Bevy build.
dev = [
    "chimera_core/dev",
    "chimera_world/dev",
    "chimera_sim/dev",
    "chimera_net/dev",
    "chimera_client?/dev",
    "chimera_present?/dev",
    "source_logic?/dev",
]
