[package]
name = "cs_source"
version = "0.1.0"
description = "Counter-Strike: Source: its simulation (loaders, parts, rules) on the engine"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No doc tests (none written): skips a rustdoc pass on every test run.
[lib]
doctest = false

# The engine's crates and the formats, Bevy and physics, Source's file
# readers; never the presentation (`engine_present`), `mashup` or another
# game (tests/it/architecture.rs checks it). Same versions and features
# as the game's (workspace dependencies), so `cargo test -p cs_source`
# reuses the game's builds.
[dependencies]
engine_core.workspace = true
engine_world.workspace = true
engine_sim.workspace = true
# The network: the game registers its round, bomb and hostages there and
# fills its hooks (`game::net`).
engine_net.workspace = true
source_formats.workspace = true
avian3d.workspace = true
bevy.workspace = true
bevy_replicon.workspace = true
bzip2.workspace = true
half.workspace = true
image.workspace = true
serde.workspace = true
sha2.workspace = true
vbsp.workspace = true
vmdl.workspace = true
vmt-parser.workspace = true
vtf.workspace = true

[features]
# Bevy as a dynamic library, as the game's `dev` (which turns this on):
# `cargo test -p cs_source --features dev` shares the game's Bevy build.
dev = ["bevy/dynamic_linking", "bevy/bevy_remote", "engine_core/dev", "engine_world/dev", "engine_sim/dev", "engine_net/dev"]
