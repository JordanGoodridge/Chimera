# ---------------------------------------------------------------------------
# Muzzle attachments' and sights' effects (attachments.md names the parts;
# section 3 and 4 say what they name): `pv_muzzle`/`hh_muzzle` (a missing
# group shows nothing) and `tracer`. Patterns: `*` matches any text; the
# first matching row wins.

[[attachment]]
names = ["Silencer_C_*", "Silencer_*_Red"]
pv_muzzle = "Silenced01_PV_Muzz"
hh_muzzle = "Silenced01_HH_Muzz"

[[attachment]]
names = ["Silencer_A_Pistol*", "Silencer_B_Pistol*"]
