hh_muzzle = "WEAPON_HH"
tracer = "Pisol01"

[[attachment]]
names = ["Silencer_A_*"]
pv_muzzle = "AK47_pv_muzz"
hh_muzzle = "WEAPON_HH"
tracer = "AR01"

[[attachment]]
names = ["Silencer_B_SMG*"]
pv_muzzle = "AK47_pv_muzz"
hh_muzzle = "WEAPON_HH"
tracer = "SMG03"

[[attachment]]
names = ["Silencer_B_SR*"]
pv_muzzle = "AK47_pv_muzz"
hh_muzzle = "WEAPON_HH"
tracer = "SR03"

[[attachment]]
names = ["Silencer_B_*"]
pv_muzzle = "AK47_pv_muzz"
hh_muzzle = "WEAPON_HH"
tracer = "AR04"

[[attachment]]
