# Combat Arms' effect and sound tables: specs/combat_arms/effects_sounds.md
# ("How effects are described as data": the ImpactFX, FireFX and TracerFX
# records, the surface table; section 11's sounds). Our numbers and names
# as the spec gives them, not a file from the game: the install's own
# attribute data (FX.TXT, SURFACE.TXT) sits in a keyed archive. File names
# are paths inside the install's archives (lower case, `/`), loaded at run
# time through the mount; effect group names are the effect file's
# (CLIENTFX.FXF, read from the install). Where the spec names no file, the
# path is our pick from the archive's folder of that surface or weapon
# (marked PLACEHOLDER).
#
# Units: world units (1.8 cm each, data/movement.toml) and seconds; volume
# 0..100. Per-weapon data (fire, reload and draw sounds, the third-person
# muzzle, the ammo's records) is each weapon's `combat_arms:effects` hook
# (data/weapons/*.toml); grenades' records are below (`[grenade]`).

# ---------------------------------------------------------------------------
# ImpactFX records (the ammo's ImpactFXName). `sound`: a file, or "surface"
# (by surface and ammo kind); `mark`: "surface" (the surface's bullet hole)
# or "" (none); `surface_fx`: also play the surface's impact group; `fx`: a
# group always played at the impact.

[impact.BulletFmj]
sound = "surface"
sound_radius = 900
create_mark = true
mark = "surface"
mark_scale = 0.075
mark_color_ratio = 0.5
surface_fx = true
fx = ""

[impact.Melee]
sound = "surface"
sound_radius = 153
create_mark = false
mark = ""
mark_scale = 0.0
surface_fx = false
fx = ""

[impact.handgrenade]
sound = "guns_snd_impacts/explosions/gren.wav"
sound_radius = 1500
# CreateMark 1 but Mark empty: no scorch.
create_mark = true
mark = ""
mark_scale = 0.0
surface_fx = true
fx = ""

[impact.flashbang_exp]
sound = "guns_snd_impacts/explosions/flash.wav"
sound_radius = 1500
create_mark = false
mark = ""
mark_scale = 0.0
surface_fx = false
fx = "Flashbang_Ini"
area = true

[impact.Smoke_Grenade]
sound = "guns_snd_impacts/explosions/smoke_exp_gas.wav"
sound_radius = 1500
create_mark = false
mark = ""
mark_scale = 0.0
surface_fx = false
fx = "Smoke_Grenade_01"
area = true

# ---------------------------------------------------------------------------
