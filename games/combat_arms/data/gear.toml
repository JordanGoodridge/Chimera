# Combat Arms' gear and perks: specs/combat_arms/gear_perks.md's stock
# tables as our data (section numbers below are its), not a file from the
# game. The install's records (WEAPONS.TXT `Gear#`, MODELBUTES.TXT `Model#`
# and `Hair#`, ATTACHMENTS.TXT `Goggle#` and `Backpack#`, MOD.TXT gear
# mods, PERKSKILLINFO.TXT, SETITEM.TXT) replace these by id when the V1
# key is configured (game/gear/records.rs). Read by game/gear.rs.
#
# Fractions are plain numbers (0.15 = 15 %); a penalty P slows by 1 - P
# (negative: faster). Damage types by the game's numbers: 2 bullet, 3 burn,
# 7 explode, 9 poison, 13 melee, 34 flash.

# ---------------------------------------------------------------------------
# Section 4: gear pieces (`Gear#`). `protects`: per damage type `ty` the
# head, torso, arm and leg fractions (`all` sets the four); `consumable`
# (default true): the blocked amount wears the armour pool. `armor`: what
# adding the piece to a living player repairs.

