# Section 12: set items. `[[item]]` maps an item number to the weapon it
# is (for per-weapon bonuses; ours, none in the stock data). `[[set]]`:
# its items and tiers; an effect is `kind` (`EffectType`), `value` and
# optionally `only` (condition items) and `locations` (kind 4: the
# locations it covers, 1 head 2 torso 3 arm 4 leg; none: everywhere).
# The stock sets are the install's (SETITEM.TXT); none are built in.

