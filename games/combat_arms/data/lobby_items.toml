# Combat Arms' lobby item list: ours, from specs/combat_arms/lobby.md E and P.
# The install's ITEMS.TXT and the shop lists are the service's and are not
# read; this is "a local item list" (F, offline stand-ins). The base items
# and their numbers are the spec's (E, "Defaults for a new player"); the
# others are examples with numbers of ours in the 900s, each standing on one
# of our weapon documents (`weapon`). Gear (heads, goggles, backpacks,
# bodies) is built from data/gear.toml by item number (head 4000 + id,
# goggles 5000 + id, backpack 7000 + id, character 10000 + id).
#
# kind: knife, throwable, assault, smg, sniper, mg, rocket, flame, shotgun
# (primary), pistol, shotgun2 (the item type listed as shotgun, type 5),
# special, assassin, crossbow. grade: higher is better (the expiry
# fallback's tie-break).

