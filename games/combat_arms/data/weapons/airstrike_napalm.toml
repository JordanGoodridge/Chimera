# The napalm air strike designator: numbers from specs/combat_arms/special_weapons.md (its sections
# in brackets), in our own data format (docs/weapon-data.md; hooks:
# games/combat_arms/src/game/special/). Our numbers as the spec gives them,
# not a file from the game; the install's attribute data overrides them
# where it can be read (game/data.rs). Where the spec has no value the line
# says PLACEHOLDER. Units: world units (1.8 cm each, by body size) and hit
# points. No sounds or models yet (the front end draws a placeholder).
id = "combat_arms:airstrike_napalm"
units = { length = 0.018, damage = 0.01 }
# Special class (key 5) [inventory.md 1].
slot = 4
# The view model's draw animation [6.12].
draw = 1.0
undroppable = false

# HideWhenEmpty: the weapon is unselectable at total 0 and the owner
# switches away; a device never drops on death [inventory.md 10, 12].
[hooks."combat_arms:inventory"]
hide_when_empty = true
drop_on_death = false
sprint_out = 0.267

[hooks."combat_arms:device"]
spawned = 1
max = 1
# The designator fires the `Invisible_Napalm` record [6.10]: 5000 u/s straight,
# `Lifetime` 7.5 s, 100 HP. The strike drops `Napalm_Shell` one per
# `AirDropDelay` 0.2 s from `AirDropHeight` 3000 u. The designator's
# own animations are not in the spec: PLACEHOLDER (1 s).
kind = "air_strike"
prefire = 0.0
key = 0.0
postfire = 1.0
redraw = 1.0
perturb = [1, 10]
dynamic_perturb = 1.0
speed = 5000.0
lifetime = 7.5
health = 100.0
box_half = [2.0, 2.0, 2.0]
[hooks."combat_arms:device".strike]
height = 3000.0
delay = 0.2
points = [[0.0, 0.0], [0.0, 200.0], [0.0, 400.0], [0.0, 600.0], [0.0, 800.0], [0.0, 1000.0]]
[hooks."combat_arms:device".strike.shell]
speed = 1550.0
gravity = true
lifetime = 10.0
health = 100.0
box_half = [10.0, 10.0, 10.0]
perturb = [1, 1]
dynamic_perturb = 0.0
# Napalm_Shell: no instant blast, a burning sphere of 350 u for 5 s keeping
# an 80 HP/s burn entry of 2 s on everyone inside [6.10].
area_damage = 0.0
area_radius = 0.0
over_time = { kind = "burn", rate = 80.0, radius = 350.0, lifetime = 5.0, duration = 2.0 }

[hooks."combat_arms:handling"]
move_penalty = 0.0
