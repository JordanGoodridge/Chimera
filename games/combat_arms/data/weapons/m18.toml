# The M18 smoke grenade: numbers from specs/combat_arms/grenades.md
# ("Data: one grenade of each kind", its sections in brackets); its
# animations are the M67's (section 3). Our numbers as the
# spec gives them, not a file from the game. Units: world units (1.8 cm)
# and hit points.
id = "combat_arms:m18"
units = { length = 0.018, damage = 0.01 }
slot = 3
draw = 0.4
undroppable = true

[hooks."combat_arms:inventory"]
hide_when_empty = true
drop_on_death = false
sprint_out = 0.267

# MovePenalty 0.03 [Data].
[hooks."combat_arms:handling"]
move_penalty = 0.03

[hooks."combat_arms:grenade"]
# PlayAutoThrowSound (default on) and Guntype 7: the team's call-out
# (grenades.md Corrections (2026-10-27) C1).
call_out = true
# SpawnedAmount / MaxAmount 2 / 2 [Data; 2].
spawned = 2
max = 2
prefire = 0.7
throw_loop = 0.067
postfire = 0.366
release_key = 0.133
reload = 0.4
# MinPerturb / MaxPerturb 1 / 1, DynamicPerturbFactor 0 [Data; 4].
perturb = [1, 1]
dynamic_perturb = 0.0
# Lifetime 3 s, Velocity 1550 [Data].
fuse = 3.0
speed = 1550.0
# Health 50 [13].
health = 50.0
# AreaDamage 1 with radius 0: the server does nothing but send the
# effect; the smoke is the clients' cloud [11].
area_damage = 1.0
area_radius = 0.0
area_type = "smoke"
# The box, half-extents: (3, 5, 5) x the model scale 2 [6].
box_half = [6.0, 10.0, 10.0]
