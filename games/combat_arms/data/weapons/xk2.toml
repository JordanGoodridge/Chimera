# The XK-2, Combat Arms' mission bomb: the objective weapon Search &
# Destroy hands every JSF player at a real round's setup and Bombing Run's
# carrier holds (specs/combat_arms/game_modes.md M3, M9; inventory.md 1,
# class 6), in our own data format (docs/weapon-data.md). It fires
# nothing: holding fire with it in hand inside a bomb site plants it (the
# game mode's rule, games/combat_arms/src/game/rules/bomb.rs). Our numbers
# where the specs give none.
#
# Units: LithTech world units (1.8 cm each: inventory.rs `UNIT`). No sounds
# or models (the front end draws a box).
id = "combat_arms:xk-2"
units = { length = 0.018, damage = 0.01 }
# Objective class (6): key 6 [inventory.md 1].
slot = 5
# PLACEHOLDER: the select animation's length isn't in the specs.
draw = 0.5
undroppable = true

# Never dropped on death (game_modes.md M3: leftover bombs are removed at
# the round's end).
[hooks."combat_arms:inventory"]
infinite = true
drop_on_death = false

# Guntype 8: the HUD's weapon panel is hidden (hud_crosshair.md D4).
[hooks."combat_arms:hud"]
bomb = true
