# The heartbeat sensor: numbers from specs/combat_arms/radar_minimap.md (S1), in our own
# data format (docs/weapon-data.md; hook: games/combat_arms/src/game/radar/
# scan.rs). Our numbers as the spec gives them, not a file from the game; the
# install's attribute data overrides them where it can be read (game/data.rs).
# The item is held and its fire input is read by the scanner rules; it has no
# shots, view model or sounds yet.
id = "combat_arms:heartbeat_sensor"
units = { length = 0.018, damage = 0.01 }
# Special class (key 5) [inventory.md 1].
slot = 4
draw = 1.0
undroppable = false

[hooks."combat_arms:inventory"]
hide_when_empty = false
drop_on_death = false
sprint_out = 0.267

[hooks."combat_arms:scanner"]
# SensorOption 0: own radar contacts, shares nothing
option = 0
# ScanDist 1000 u; BatteryMaxQuantity 100, BatteryUsingQuantity 10 a second,
# BatteryRefillQuantity 5 per BatteryRefillTime 1000 ms [S1]; ScanSendTime
# 7000 ms [S2].
scan_dist = 1000.0
battery_max = 100.0
using = 10.0
refill = 5.0
refill_time = 1000.0
send_time = 7000.0

[hooks."combat_arms:handling"]
move_penalty = 0.0
