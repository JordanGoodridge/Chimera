# The M-23F incendiary grenade: numbers from specs/combat_arms/grenades.md
# ("Data: one grenade of each kind", section 12). The spec's table has no
# weapon-record values for it (perturb, move penalty) and assumes the
# M67's animations: the M67's (ours). Our numbers as the spec gives them,
# not a file from the game. Units: world units (1 cm) and hit points.
id = "combat_arms:m23f"
units = { length = 0.01, damage = 0.01 }
slot = 3
draw = 0.4
undroppable = true

[hooks."combat_arms:inventory"]
hide_when_empty = true
drop_on_death = false
sprint_out = 0.267

[hooks."combat_arms:grenade"]
# SpawnedAmount / MaxAmount 1 / 2 [Data; 2].
spawned = 1
max = 2
prefire = 0.7
release_key = 0.067
postfire = 0.366
perturb = [1, 10]
dynamic_perturb = 1.0
# Lifetime 3 s, Velocity 1550 [Data].
fuse = 3.0
speed = 1550.0
# Health 50 [13].
health = 50.0
area_damage = 0.0
area_radius = 0.0
area_type = "none"
# ProgDamage 5 HP/s of burn within ProgDamageRadius 350 for
# ProgDamageLifetime 9 s, each entry lasting ProgDamageDuration 10 s [12].
over_time = { kind = "burn", rate = 5.0, radius = 350.0, lifetime = 9.0, duration = 10.0 }
# PLACEHOLDER (Open question 9).
half_height = 2.0
