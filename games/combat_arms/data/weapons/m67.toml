# The M67, Combat Arms' frag grenade and the stock loadout's grenade:
# numbers from specs/combat_arms/grenades.md ("Data: one grenade of each
# kind", its sections in brackets) and inventory.md (animation lengths),
# in our own data format (docs/weapon-data.md; the `combat_arms:grenade`
# hook: games/combat_arms/src/game/grenades.rs). Our numbers as the spec
# gives them, not a file from the game.
#
# Units: LithTech world units (1.8 cm each, by body size: inventory.rs
# `UNIT`) and hit points. No sounds or models (the front end draws a
# placeholder ball in flight).
id = "combat_arms:m67"
units = { length = 0.018, damage = 0.01 }
# Throw class (4): key 4 [2].
slot = 3
# The select animation, 400 ms (inventory.md, Constants).
draw = 0.4
undroppable = true

# HideWhenEmpty 1 [Data]; grenades never drop on death (inventory.md 12);
# post-sprint 267 ms (inventory.md, Constants).
[hooks."combat_arms:inventory"]
hide_when_empty = true
drop_on_death = false
sprint_out = 0.267

# MovePenalty 0.03 [Data].
[hooks."combat_arms:handling"]
move_penalty = 0.03

[hooks."combat_arms:grenade"]
# Ammo SpawnedAmount / MaxAmount 1 / 1 [Data; 2].
spawned = 1
max = 1
# The view-model animations [3]: the pre-fire (pin pull) 700 ms, the throw
# 67 ms (again while fire is held), the post-fire 366 ms with the release
# at its fire key, 133 ms in, and the reload 400 ms that re-readies the
# next (the M67, XM84 and M18 alike).
prefire = 0.7
throw_loop = 0.067
postfire = 0.366
release_key = 0.133
reload = 0.4
# Weapon MinPerturb / MaxPerturb 1 / 10, DynamicPerturbFactor 1 [Data; 4].
perturb = [1, 10]
dynamic_perturb = 1.0
# Projectile Lifetime 2.5 s (the fuse), Velocity 1550 [Data; 4, 8];
# DropVelocity 500 (the drop perk's, 14).
fuse = 2.5
speed = 1550.0
drop_speed = 500.0
# Ammo Health 300 [13]; CanHitSameKind 1 [6].
health = 300.0
hits_same_kind = true
# Ammo AreaDamage 60, AreaDamageRadius 450, AreaDamageType 7 (explode) [9].
area_damage = 60.0
area_radius = 450.0
area_type = "explode"
# The box, half-extents: the world model's first animation (3, 3, 4) x
# its scale 2 (`grenade_box`); y is the at-rest nudge's half-height [6].
box_half = [6.0, 6.0, 8.0]
