drop_on_death = false
sprint_out = 0.267

[hooks."combat_arms:grenade"]
# SpawnedAmount / MaxAmount 1 / 2 [Data; 2].
spawned = 1
max = 2
prefire = 0.7
throw_loop = 0.067
postfire = 0.366
release_key = 0.133
reload = 0.4
perturb = [1, 10]
dynamic_perturb = 1.0
# Lifetime 3 s, Velocity 1550 [Data].
fuse = 3.0
speed = 1550.0
# Health 50 [13].
health = 50.0
area_damage = 0.0
area_radius = 0.0
area_type = "none"
# ProgDamage 6 HP/s of poison within ProgDamageRadius 350 for
# ProgDamageLifetime 9 s, each entry lasting ProgDamageDuration 2.5 s [12].
over_time = { kind = "poison", rate = 6.0, radius = 350.0, lifetime = 9.0, duration = 2.5 }
# The box: PLACEHOLDER, the M67's (not in the spec).
box_half = [6.0, 6.0, 8.0]
