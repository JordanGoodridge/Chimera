# The XM84 flashbang: numbers from specs/combat_arms/grenades.md ("Data:
# one grenade of each kind", its sections in brackets); its animations are
# the M67's (section 3). Our numbers as the spec gives them,
# not a file from the game. Units: world units (1.8 cm) and hit points.
id = "combat_arms:xm84"
units = { length = 0.018, damage = 0.01 }
slot = 3
draw = 0.4
undroppable = true

[hooks."combat_arms:inventory"]
hide_when_empty = true
drop_on_death = false
sprint_out = 0.267

# MovePenalty 0.03 [Data].
[hooks."combat_arms:handling"]
move_penalty = 0.03

[hooks."combat_arms:grenade"]
# PlayAutoThrowSound (default on) and Guntype 7: the team's call-out
# (grenades.md Corrections (2026-10-27) C1).
call_out = true
# SpawnedAmount / MaxAmount 2 / 2 [Data; 2].
spawned = 2
max = 2
prefire = 0.7
throw_loop = 0.067
postfire = 0.366
release_key = 0.133
reload = 0.4
# MinPerturb / MaxPerturb 1 / 1, DynamicPerturbFactor 0 [Data; 4].
perturb = [1, 1]
dynamic_perturb = 0.0
# Lifetime 1.5 s, Velocity 1550 [Data].
fuse = 1.5
speed = 1550.0
# Health 50 [13]; CanHitSameKind 0 [6].
health = 50.0
hits_same_kind = false
# AreaDamage 25 (the flash amount, seconds), radius 1000, type 34 (flash)
# [10].
area_damage = 25.0
area_radius = 1000.0
area_type = "flash"
# The box, half-extents: (2, 5, 5) x the model scale 2 [6].
box_half = [4.0, 10.0, 10.0]
