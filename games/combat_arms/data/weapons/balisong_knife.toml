# The balisong_knife (melee): numbers from specs/combat_arms/special_weapons.md (its sections
# in brackets), in our own data format (docs/weapon-data.md; hooks:
# games/combat_arms/src/game/special/). Our numbers as the spec gives them,
# not a file from the game; the install's attribute data overrides them
# where it can be read (game/data.rs). Where the spec has no value the line
# says PLACEHOLDER. Units: world units (1.8 cm each, by body size) and hit
# points. No sounds or models yet (the front end draws a placeholder).
id = "combat_arms:balisong_knife"
units = { length = 0.018, damage = 0.01 }
# Melee class (3): key 3 [inventory.md 1, 5].
slot = 2
# The select animation [5, the table's Draw].
draw = 0.5
undroppable = true

# Infinite, never dropped on death (inventory.md 12). Post-sprint:
# PLACEHOLDER, the M9's 167 ms.
[hooks."combat_arms:inventory"]
infinite = true
drop_on_death = false
sprint_out = 0.167

# The knife rules of the M9 [5]: `Range` 130; left button `fire_0` with the
# ammo's `InstDamage` 52, right button `alt_fire_0` with `Alt_InstDamage`
# 30; one attack ray per hit key; the roll `DamageRFacter` 0.1; no
# pre-fire (1 ms as the M9's), a held button repeats with no gap.
[hooks."combat_arms:knife"]
range = 130.0
damage_spread = 0.1
fire_rate = 0.0
perturb = 1.0
primary = { prefire = 0.001, length = 0.65, hits = [0.179], damage = 52.0, postfire = 0.001 }
secondary = { prefire = 0.001, length = 0.9, hits = [0.354, 0.498], damage = 30.0, postfire = 0.001 }

# MovePenalty [5, the table].
[hooks."combat_arms:handling"]
move_penalty = 0.0

# view_models.md 4, 9, 10: no per-weapon placement known: PLACEHOLDER zeros.
[hooks."combat_arms:view_model"]
muzzle_pos = [0.0, 0.0, 0.0]
breach_offset = [0.0, 0.0, 0.0]
muzzle_fx = ""
shells = false
