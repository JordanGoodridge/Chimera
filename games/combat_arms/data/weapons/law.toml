# The LAW rocket launcher: numbers from specs/combat_arms/special_weapons.md (its sections
# in brackets), in our own data format (docs/weapon-data.md; hooks:
# games/combat_arms/src/game/special/). Our numbers as the spec gives them,
# not a file from the game; the install's attribute data overrides them
# where it can be read (game/data.rs). Where the spec has no value the line
# says PLACEHOLDER. Units: world units (1.8 cm each, by body size) and hit
# points. No sounds or models yet (the front end draws a placeholder).
id = "combat_arms:law"
units = { length = 0.018, damage = 0.01 }
# Special class (key 5) [inventory.md 1, 2].
slot = 4
# The view model's draw animation [2].
draw = 1.333

# Clip 1 and total 3 [2, Stock values].
[ammo."combat_arms:law_rocket"]
max = 2

# RapidFireCount 1: one shot a press; the cycle is the fire animation [2].
[trigger]
automatic = false
cycle = 1.0
timing = "accumulate"

# The reload animation; an empty clip reloads once the fire animation ends
# [weapon_firing.md]. Rounds are made by `combat_arms:projectile` below,
# so the frame traces nothing ([hitscan] only gives it a `Fired` round).
[magazine]
clip = 1
ammo = "combat_arms:law_rocket"
reload = 3.333
auto_reload = true

[hitscan]
range = 1.0
pellets = 1
punch_scale = 1.0

# The `Missile` record [2]: 1300 u/s straight for 10 s, 50 HP, scale 0.35
# (the box 44.8 x 5.6 x 5.6), `CanHitSameKind` 0; cone 1..30 x 1.01 with the
# meters at 0 (n = 1); the ammo's blast 40.0 / 550, explode (type 7).
[hooks."combat_arms:projectile"]
speed = 1300.0
gravity = false
lifetime = 10.0
health = 50.0
box_half = [44.8, 5.6, 5.6]
hits_same_kind = false
perturb = [1, 30]
dynamic_perturb = 1.01
area_damage = 40.0
area_radius = 550.0
area_type = 7

# BaseCamRecoilPitch 5.5 with a 200.0 degree cap [2].
[hooks."combat_arms:recoil"]
pitch = 5.5
max_pitch = 200.0

# MovePenalty [2].
[hooks."combat_arms:handling"]
move_penalty = 0.2
