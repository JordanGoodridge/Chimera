# Combat Arms' Dragunov SVD, the semi-automatic sniper rifle of
# specs/combat_arms/weapon_classes.md: the reference build's numbers as
# its "Typical weapons" table gives them ([TW: row]) and section 6
# ([6.x]); its scope, "Dragunov Scope", from "Scope records" ([SR]).
# Fields the class spec doesn't give are left to the attribute defaults
# (specs/combat_arms/attribute_data.md). The install's own record
# overrides these when it can be read. Our numbers, not a file from the
# game.
#
# The format: docs/weapon-data.md; the hooks: game/weapons.rs. Units:
# world units (1.8 cm each, by body size) and hit points.
id = "combat_arms:dragunov_svd"
units = { length = 0.018, damage = 0.01 }
# A primary (inventory class 1).
slot = 0
# [TW: Draw] 1200 ms.
draw = 1.2

# [TW: Clip / total] 10 / 40.
[ammo."combat_arms:7.62mm_svd"]
max = 30

# [TW: RapidFireCount] 1, [TW: Fire] 400 ms ([6.3]: one round a press, at
# most one per 400 ms).
[trigger]
automatic = false
cycle = 0.4
timing = "accumulate"
# weapon_firing.md Corrections 10: the update that sees the press only
# enters the firing state; the pre-fire (even a 0 ms one) and fire_0 take
# one update each, so the first round comes 3 updates on.
latency = 3

# [TW: Clip / total] 10, [TW: Reload] 2600 ms.
[magazine]
clip = 10
ammo = "combat_arms:7.62mm_svd"
reload = 2.6
auto_reload = true

# [TW: Range] 5000, one ray.
[hitscan]
range = 5000.0
pellets = 1
punch_scale = 1.0

# [TW: Rays x damage] 100, [TW: Bands] 4000/4500/5000 at 1.0/0.7/0.35.
[hooks."combat_arms:damage"]
damage = 100.0
damage_type = 2
effect_range = [4000.0, 4500.0, 5000.0]
range_damage = [1.0, 0.7, 0.35]

# [TW: MinPerturb/MaxPerturb] 100/100, [TW: DynamicPerturbFactor] 1.0,
# [TW: PerturbIncSpeed/DecSpeed] 1.0/0.1, [TW: Zoomed min/max] 2/30 and
# inc/dec 1.0/0.5, [TW: Fire cap] 1.0 all, [TW: Walk / run / jump target]
# 1.0 all, [TW: DecDelay] 2400 ms.
[hooks."combat_arms:spread"]
cone = { min = 100, max = 100, inc = 1.0, dec = 0.1 }
zoomed_cone = { min = 2, max = 30, inc = 1.0, dec = 0.5 }
dynamic_factor = 1.0
state = { fire = 1.0, fire_move = 1.0, fire_duck = 1.0, fire_move_duck = 1.0, walk = 1.0, run = 1.0, jump = 1.0 }
dec_delay = 2400.0

# [TW: Kick] 4 / 5, [TW: MaxRandomPitch] 0, [TW: Wag] -1/1, 10; [6.4]
# MaxRandomwag 0.
[hooks."combat_arms:recoil"]
pitch = 4.0
max_pitch = 5.0
random_pitch = 0.0
wag_r = -1.0
wag_l = 1.0
max_wag = 10.0
random_wag = 0.0

# [TW: ZoomTime] 0.10 s, [TW: Sway] X 6.5/6, Y 1.1/10,
# [TW: ReloadAfterFire] 0. Its scope is the attachment below.
[hooks."combat_arms:zoom"]
zoom_time = 0.1
sway = { x_speed = 6.5, x_freq = 6.0, y_speed = 1.1, y_freq = 10.0 }

# [TW: Scope] / [SR] DefaultScopeAttach "Dragunov Scope" (one level at 20
# degrees: data/attachments/mods.toml), fitted when the weapon is given
# (attachments.md, "Fitting"). The spec lists no other parts for it.
[hooks."combat_arms:attachments"]
accepts = ["Dragunov Scope"]
defaults = { sight = "Dragunov Scope" }

# [TW: MovePenalty] 0.24.
[hooks."combat_arms:handling"]
move_penalty = 0.24

# [TW: DisableCrosshair] 1.
[hooks."combat_arms:hud"]
disable_crosshair = true

# effects_sounds.md, "How effects are described as data" and 11: the
# ammo's ImpactFX, FireFX and TracerFX records (data/effects.toml), the
# third-person muzzle group and the weapon's sounds (files inside the
# install's archives; snipers: SR01 PLACEHOLDER and WEAPON_HH).
[hooks."combat_arms:effects"]
ammo_kind = "bullet"
impact = "BulletFmj"
fire = "7.62mm"
tracer = "SR01"
hh_muzzle = "WEAPON_HH"
fire_sound = "guns_snd_sr/dragunov/fire.wav"
fire_radius = 3000
silenced_sounds = ["guns_snd_option/sr/silenced1.wav", "guns_snd_option/sr/silenced2.wav"]
reload_sounds = ["guns_snd_sr/dragunov/reload1.wav", "guns_snd_sr/dragunov/reload2.wav", "guns_snd_sr/dragunov/reload3.wav"]
select_sound = "guns_snd_sr/dragunov/select.wav"
deselect_sound = "guns_snd_sr/dragunov/deselect.wav"
