# Combat Arms' MP5A4, the SMG of specs/combat_arms/weapon_classes.md: the
# reference build's numbers as its "Typical weapons" table gives them
# ([TW: row]) and section 2 ([2]). Fields the class spec doesn't give
# (the damage roll, the server spacing, the kick's acceleration, side
# randomness, back push and return rates, the post-sprint time) are left
# to the attribute defaults (specs/combat_arms/attribute_data.md). The
# install's own record overrides these when it can be read. Our numbers,
# not a file from the game.
#
# The format: docs/weapon-data.md; the hooks: game/weapons.rs. Units:
# world units (1.8 cm each, by body size) and hit points.
id = "combat_arms:mp5a4"
units = { length = 0.018, damage = 0.01 }
# A primary (inventory class 1).
slot = 0
# [TW: Draw] 1000 ms.
draw = 1.0
# Its class in an automatic gun game (docs/weapon-data.md); install
# weapons copied from this document keep it.
class = "smg"

# [TW: Clip / total] 30 / 120: the reserve is the total minus the clip.
[ammo."combat_arms:9mm_mp5a4"]
max = 90

# [TW: RapidFireCount] 0, [TW: Fire] 80 ms; [2] 750 rounds/min at exact
# time.
[trigger]
automatic = true
cycle = 0.08
timing = "accumulate"
# weapon_firing.md Corrections 10: the update that sees the press only
# enters the firing state; the pre-fire (even a 0 ms one) and fire_0 take
# one update each, so the first round comes 3 updates on.
latency = 3

# [TW: Clip / total] 30, [TW: Reload] 2000 ms.
[magazine]
clip = 30
ammo = "combat_arms:9mm_mp5a4"
reload = 2.0
auto_reload = true

# [TW: Range] 2500, [TW: Rays x damage] one ray.
[hitscan]
range = 2500.0
pellets = 1
punch_scale = 1.0

# [TW: Rays x damage] 29 (bullet), [TW: Bands] 500/2000/2500,
# [TW: x per band] 1.1/0.7/0.35 ([2]: the close-range bonus).
[hooks."combat_arms:damage"]
damage = 29.0
damage_type = 2
effect_range = [500.0, 2000.0, 2500.0]
range_damage = [1.1, 0.7, 0.35]

# [TW: MinPerturb/MaxPerturb] 8/100, [TW: PerturbIncSpeed/DecSpeed]
# 0.8/0.37, [TW: Zoomed min/max] 7/17 and [TW: Zoomed inc/dec] 0.8/0.37,
# [TW: DynamicPerturbFactor] 1.0, [TW: Fire cap] .18/.20/.17/.19,
# [TW: Walk / run / jump target] .09/.10/.58, [TW: DecDelay] 180 ms.
[hooks."combat_arms:spread"]
cone = { min = 8, max = 100, inc = 0.8, dec = 0.37 }
zoomed_cone = { min = 7, max = 17, inc = 0.8, dec = 0.37 }
dynamic_factor = 1.0
state = { fire = 0.18, fire_move = 0.20, fire_duck = 0.17, fire_move_duck = 0.19, walk = 0.09, run = 0.10, jump = 0.58 }
dec_delay = 180.0

# [TW: Kick] 1.4 / 7, [TW: MaxRandomPitch] 0.03, [TW: Wag] -1.2/1.2, 15.
[hooks."combat_arms:recoil"]
pitch = 1.4
max_pitch = 7.0
random_pitch = 0.03
wag_r = -1.2
wag_l = 1.2
max_wag = 15.0

# [TW: ZoomTime] 0.15 s, [TW: Sway] the defaults; [TW: Scope] none, so it
# doesn't zoom (7.1).
[hooks."combat_arms:zoom"]
zoom_time = 0.15

# attachments.md "Sound": FireSndRadius 1800, silenced 1200. Its accepted
# list isn't in the spec: none (the install's modification file gives it).
[hooks."combat_arms:attachments"]
fire_sound_radius = 1800
silenced_radius = [1200, 1200]

# [TW: MovePenalty] 0.07.
[hooks."combat_arms:handling"]
move_penalty = 0.07

# view_models.md 4, 9, 10 (per-weapon placement): `PVMuzzleFXName` (the
# install gives `MuzzlePos`; placeholders without it).
[hooks."combat_arms:view_model"]
muzzle_fx = "AK47_pv_muzz"
shells = true

# effects_sounds.md, "How effects are described as data" and 11: the
# ammo's ImpactFX, FireFX and TracerFX records (data/effects.toml), the
# third-person muzzle group and the weapon's sounds (files inside the
# install's archives; the MP5 family's tracer SMG01; files: our pick by folder).
[hooks."combat_arms:effects"]
ammo_kind = "bullet"
impact = "BulletFmj"
fire = "9mm"
tracer = "SMG01"
hh_muzzle = "WEAPON_HH"
fire_sound = "guns_snd_smg/mp5a4/fire.wav"
fire_radius = 1800
silenced_sounds = ["guns_snd_option/smg/silenced1.wav", "guns_snd_option/smg/silenced2.wav"]
dry_fire_sound = "guns_snd_smg/mp5a4/dryfire.wav"
reload_sounds = ["guns_snd_smg/mp5a4/reload1.wav", "guns_snd_smg/mp5a4/reload2.wav", "guns_snd_smg/mp5a4/reload3.wav"]
select_sound = "guns_snd_smg/mp5a4/select.wav"
deselect_sound = "guns_snd_smg/mp5a4/deselect.wav"
