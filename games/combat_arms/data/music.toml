# Cues by their attribute key (Section 4; inferred).
[cues]
loading = "BGM/Map_Loading.mp3"
quarantine_mode = "BGM/Zombie_Ambience.mp3"
quarantine_end = "BGM/QRT_Count_BGM.mp3"
capture_progress = "BGM/HQM_count_BGM.mp3"
last_stage = "BGM/modebgm/weaponrace_last.mp3"
war_cry = "BGM/Ability/WarCry/WarCry.mp3"
eagle_eye = "BGM/Ability/EagleEye/Alignment.mp3"

# The mode start track at the first real round (the room data's
# `StartBGM`, `LoopBGM`, by mode key; Open questions 1, 12): none for the
# modes whose file is not obvious.
[modes.TMM]
start = "BGM/modebgm/Search&Destroy.mp3"
[modes.TSV]
start = "BGM/modebgm/Elimination.mp3"
[modes.BNT]
start = "BGM/modebgm/SpyHunt.mp3"
[modes.SQM]
start = "BGM/modebgm/HiredGuns.mp3"
[modes.VTDM]
start = "BGM/modebgm/VIP_start.mp3"
[modes.VWRM]
start = "BGM/modebgm/weaponrace_start.mp3"
# Arms Race's start music repeats when the last stage is left
# (`LoopBGM` set).
loop = true

# The interface sounds the cues name (Section 4, 7): attribute key to the
# file in the install's sound archives. The files are in the keyed
# attribute file (Open question 1), so none is named here; a key with no
# file plays nothing (the cue still happens and is counted).
[interface]

# A party match (a minigame played with Combat Arms' music: Chimera's
# minigame::moments; music_ambience.md Section 10): the mode whose start
# track (at the start of play, if alive) and last-stage music (while a
# player is on the ladder's last rung) it plays, and the files of the
# interface sounds its director plays there: the round start and the
# respawn countdown. The files are inferred from their names in
# UI_SND.rez (Section 7). The rung-up and last-rung sounds are the cue
# pack's (data/cues.toml), the result sounds the match-end screen's
# (GameParts::match_won_sound, match_lost_sound).
[party]
mode = "VWRM"
[party.interface]
RoundStartSound = "UI_SND/ROUNDSTART.WAV"
RespawnCountSound = "UI_SND/RESPWANCOUNT.WAV"
