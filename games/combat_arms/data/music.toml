# The spec says 602.281 s; the decoder gives 600.12 s (the only file that
# differs: the spec's figure is probably the size over the bitrate).
"BGM/Null_60S.mp3" = 600.12
"BGM/Ability/WarCry/WarCry.mp3" = 9.517
"BGM/Ability/EagleEye/Alignment.mp3" = 8.864

# The menu playlist, in order: display name and file (inferred: the names
# of the loose files with no mode in them; Open question 2). All ticked
# by default.
[[playlist]]
name = "BGM_LOOP"
file = "BGM/BGM_LOOP.mp3"
[[playlist]]
name = "UIBGM_LOOP"
file = "BGM/UIBGM_LOOP.mp3"
[[playlist]]
