file = "BGM/BGM_03.mp3"
[[playlist]]
name = "BGM_05"
file = "BGM/BGM_05.mp3"
[[playlist]]
name = "BGM_06"
file = "BGM/BGM_06.mp3"
[[playlist]]
name = "BGM_07"
file = "BGM/BGM_07.mp3"
[[playlist]]
name = "BGM_08"
file = "BGM/BGM_08.mp3"
[[playlist]]
