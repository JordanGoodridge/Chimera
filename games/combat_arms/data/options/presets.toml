# Combat Arms' quality presets (specs/combat_arms/options.md G4): what
# choosing Low, Mid or High writes on OK. `name` is the stored
# `[Settings]` key, `cvar` the console variable; the columns are the
# spec's. A custom apply writes the custom block (the rows with
# `custom = true`, from the screen's switches) instead and keeps the rest
# as they are.

