# Bullet (slot 3): [Bullet]'s table; stat-only (no type, no socket). The
# special functions: `type` InstDamage, Stun, Knockback or Crit, `target`
# All, Player, Npc, Human, Zombie, PH, PZ, NH or NZ (default All),
# `probability` (default 1). QR II and III and the pistols' PVP Damage I
# carry only the misspelled range key nothing reads (Quirk Q5): no
# `range_per` here.

[[mod]]
name = "Bullet_FT_I_{class}"
classes = ["AR", "SMG", "SR", "MG", "Pistol", "SG"]
kinds = 3
integrated = 1
range_per = 0.25
special = [{ type = "InstDamage", target = "NZ", value = 2.0 }]

