# Combat Arms' weapon attachments ("modifications"): the reference build's
# records as specs/combat_arms/attachments.md gives them (section names in
# brackets: [Muzzle], [Sight], [Magazine], [Bullet], [Mechanical sight],
# [Data] for "How attachments are described in the data") and the scope
# records of specs/combat_arms/weapon_classes.md ([WC: Scope records]).
# Our numbers, not a file from the game: the install's own modification
# file (MOD.TXT) overrides these by name when it can be read
# (game/data.rs).
#
# One `[[mod]]` per record. `name` may hold `{class}`, expanded once per
# entry of `classes` ([Which weapon accepts which]: the AR, SMG, SR, MG,
# Pistol and SG families differ only in models, tracer and magazine
# columns, so a family shares its numbers). Keys are the record's fields
# in snake case (game/attachments.rs, `ModRecord`): `kinds` is the slot (0
# muzzle, 1 sight, 2 magazine, 3 bullet, 4 mechanical sight), `type` 0
# silencer, 1 scope, 2 dot sight, 3 flash hider, 4 muzzle attachment, 5
# magazine; fractions are fractions (-0.1 is -10 %). A field left out is
# 0 (none). `socket`: where a part model goes on the gun (muzzle flash,
# breach, scope); no model names (the install's).

