# D, C, O, S: the modes, `[Mode#]` in the room data's order. Fields:
#  id, key (the room key), name (US), game_type, sort (SortingOrder),
#  default_map (a map id), enable_play, single_play, rules (the lobby has
#  rules for it: modes 20-25 have none), one_team,
#  players = [min, max, step, recommended], goal = [min, max, step,
#  default] with goal_label; goal_lobby_max (the lobby's own wider limit,
#  open question 13),
#  weapon_use / join_combat / team_kill / view_enemy / mutation / perk
#  (the Enable...Setting flags; perk absent = on),
#  refuse_ff / refuse_cam / refuse_perk / refuse_arms (the lobby's O table),
#  cam_default / perk_default / arms_default (O defaults),
#  start (S): "teams" [host team min, other min] or "total" n (the lobby's
#  rule; the client's is min_players / 2 a team, or the same total).
