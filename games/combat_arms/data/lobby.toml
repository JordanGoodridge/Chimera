name = "No Sniper Rifles"
kind = "except"
order = 1
[[arms]]
id = 4
name = "No Explosives"
kind = "except"
order = 3
[[arms]]
id = 5
name = "No Backpack"
kind = "except"
order = 4
[[arms]]
id = 6
name = "Sniper Only"
kind = "only"
order = 5
[[arms]]
id = 7
name = "Shotguns Only"
kind = "only"
order = 6
[[arms]]
id = 8
name = "No Shotguns"
kind = "except"
order = 2
[[arms]]
id = 9
name = "Duty Roster"
kind = "none"
order = 9
listed = false
[[arms]]
id = 10
name = "Only Go4CA Cup Item"
kind = "only"
order = 10
cup = true

