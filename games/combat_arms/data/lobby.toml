# Combat Arms' lobby data: our defaults, from specs/combat_arms/lobby.md
# (section letters below are its). The room data file (GAMEROOM.TXT) and
# the layout attributes' [ArmsOption] list are the install's and are not
# read (Known shortcuts in game/lobby/data.rs); these are the "US room
# data" numbers the spec quotes (D, C "Ranges offered", O, S).
#
# Read by games/combat_arms/src/game/lobby/data.rs (`LobbyData`).

# C: the five default room titles (picked by the millisecond clock).
titles = [
    "Welcome to Combat Arms: the Classic",
    "Weapons Hot!",
    "Nowhere to Hide",
    "Armed & Dangerous",
    "Engaging the Enemy",
]

# D: the arms options (`[ArmsOption]`, US names). `kind`: only, except, or
# none (All Permitted); `order`: the dropdown order; `listed` false: in no
# list (Duty Roster, quirk 8); `cup`: listed only in the Go4CA Cup mode.
[[arms]]
id = 0
name = "All Permitted"
kind = "none"
order = 0
[[arms]]
id = 1
name = "Pistols Only"
kind = "only"
order = 7
[[arms]]
id = 2
name = "Melee Only"
kind = "only"
order = 8
[[arms]]
