# Combat Arms bots: our defaults, from specs/combat_arms/bots.md
# ("Constants", "Difficulty, profiles and loadouts"). Read by
# games/combat_arms/src/game/bots/data.rs (`BotData`).
#
# Per-template values are arrays of 12, one per attribute template, in
# the spec's column order:
#   NN NH NE  (Easy: level "Normal", archetypes N, H, E)
#   HN HH HE  (Normal: level "Hard")
#   XN XH XE  (Veteran: level "Extreme")
#   TN TH TE  (training: level "Tutorial")
# A single number is the same in every column. Distances are world units
# (u), times seconds.

