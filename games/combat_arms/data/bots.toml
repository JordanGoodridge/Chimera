# Profiles per level (the counts are the spec's: Easy 22, Normal 25,
# Veteran 26, Tutorial 6). The install's profile file (names, clans,
# ranks, chat) isn't read: a bot is named after its team and profile
# number (`AI_Alpha_<n>`, `AI_Bravo_<n>`), its archetype is PLACEHOLDER
# (profile number mod 3: N, H, E), its item sets those of its level below.
# Heard sounds (5.3, Corrections 2, 3; Open question 25: the install's
# values weren't read): each stimulus's alarm level and the brain's
# major-alarm threshold. Gunfire is 75 (Open question 12) and above the
# threshold; footsteps and the rest are ours, below it.
[alarm]
major = 50.0
gunfire = 75.0
footstep = 20.0
ally_call = 1.0

# Chat (10, Correction 6; Open question 26): the cooldown of a profile
# that has no `NextChatTime` of its own, and the profiles that have one
# (`level` easy|normal|veteran|tutorial, `profile` the profile index).
[chat]
default_cooldown = 10.0
# [[chat.profiles]]
# level = "easy"
# profile = 3
# cooldown = 25.0

[profiles]
easy = 22
normal = 25
veteran = 26
tutorial = 6

# Item sets (PLACEHOLDER: the install's sets name weapons we don't have
# yet; these use ours, with the spec's use-percents). Slots in filling
# order: model, backpack, head, goggle (cosmetic, empty here), then the
# weapon slots mid primary, long primary, secondary, melee, grenade,
# mine. `level` is easy, normal, veteran or tutorial.
[[item_sets]]
level = "easy"
mid = { percent = 100, items = ["combat_arms:m4a1", "combat_arms:mp5a4"] }
long = { percent = 60, items = ["combat_arms:l96a1"] }
secondary = { percent = 100, items = ["combat_arms:beretta_m92fs"] }
melee = { percent = 100, items = ["combat_arms:m9_knife"] }
grenade = { percent = 45, items = ["combat_arms:m67"] }

