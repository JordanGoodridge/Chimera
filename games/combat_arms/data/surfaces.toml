# Combat Arms' shoot-through surfaces: specs/combat_arms/weapon_firing.md,
# "Penetration" (the surface table's MaxShootThroughThickness,
# MaxShootThroughPerturb, BulletRangeDampen, BulletDamageDampen). Our
# numbers as the spec gives them, not a file from the game. Surfaces not
# listed (concrete, metal, ...) stop bullets.
#
# `names`: the surface names a row covers (matched without case against a
# collider's `PropSurface`); `thickness`: the most material a bullet
# passes, world units (0: always passes); `perturb`: the exit direction's
# random offset, thousandths per axis; `range` and `damage`: what is left
# of each after passing, as factors.
units = { length = 0.01 }

[[surface]]
names = ["wood"]
thickness = 10.0
perturb = 10.0
range = 1.0
damage = 0.5

