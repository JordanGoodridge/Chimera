# Head pieces (`Hair#`): the file per skeleton index (2: an empty name is
# no head piece).
[[head]]
id = 0
name = "HBasic"
files = []

[[head]]
id = 2
name = "Combat_Helmet"
files = ["CHARS_M_HEAD\\Combat_Helmet.ltb", "CHARS_M_HEAD\\W_Combat_Helmet.ltb"]

# Faces (`Face#`): the default (2: a fresh selection's face 0). The
# spec names no face files or skins: with the V1 key the install's models
# file gives every face's (and head piece's) files, skins and the head
# piece a face comes with (`HairIndex`).
[[face]]
id = 0
name = "Face_a"

# Goggles and masks (`Goggle#`): the socket and the file per figure type
# (the male one is not in the spec).
[[goggle]]
id = 0
socket = "Eyes"
files = ["", "ATTACH_M\\W_Glass.ltb"]

# Team marks (`[TeamMark]`, 2): 0 shows nothing (the transparent mark
# style), 1 a teammate's.
[marks]
enemy = "CHARS_T_BODY\\Alpha.dtx"
teammate = "CHARS_T_BODY\\RED_Tie.dtx"

# Each weapon's third-person animation class (`AniType`, 5) and leg set
# (`LowerAniType`: 0 normal, 1 infected, 2 infected with a club); `skins`
# its `HHSkin#` list and `frames` its `HHAniFrame_0..9` (ms, 0 none: no
# rate change; absent in the stock data, 7). The classes are ours by the
# weapon's kind (the weapons file's `AniType` is V1-keyed): the M4A1's 0
# is the spec's.
[weapons."combat_arms:m4a1"]
ani_type = 0
[weapons."combat_arms:mp5a4"]
ani_type = 3
[weapons."combat_arms:m60"]
ani_type = 8
[weapons."combat_arms:remington_870"]
ani_type = 7
[weapons."combat_arms:l96a1"]
ani_type = 5
[weapons."combat_arms:dragunov_svd"]
ani_type = 5
[weapons."combat_arms:beretta_m92fs"]
ani_type = 10
[weapons."combat_arms:m9_knife"]
ani_type = 14
[weapons."combat_arms:m67"]
ani_type = 11
[weapons."combat_arms:xm84"]
ani_type = 11
[weapons."combat_arms:m18"]
ani_type = 11
[weapons."combat_arms:m23f"]
ani_type = 11
[weapons."combat_arms:g7a"]
ani_type = 11

# How long a player's body stays after its owner respawned and its death
# animation ended (10), seconds by game mode (`ca_mode`); a mode not
# listed never removes it (a new round does).
[body_removal]
"combat_arms:tdm" = 5.0

# Sections 3 and 11: the stock skeletons. `nodes` are the tree's nodes the
# game uses (name, parent; `at`: where the spec measured them at `LST`
# t = 0, the fallback pose while no model is loaded); `spheres` the hit
# table (`Skeleton#`: radius, location 1 head 2 torso 3 arm 4 leg 5 groin,
# damage factor; `socket` when it sits on a socket of that parent and
# offset, `absent` when no stock body has it; `bind` and `at` its centre
# in the bind pose and at `LST` t = 0); `sockets` the sockets the game uses
# (parent, offset, rotation, `bind`, and `at`: the "stand" pose's position
# where the spec gives one, our fallback). `aim` is section 8's seven
# nodes in order.

