# Combat Arms' player characters: the records specs/combat_arms/characters.md
# gives (section numbers below are its), our numbers, not a file from the
# game. The install's MODELBUTES.TXT, ATTACHMENTS.TXT and MARKS.TXT would
# override them once the V1 key is configured (attribute_data.md); the
# skeleton's measured positions come from the US reference client's
# character archives, as the spec measured them.
#
# Units: LithTech world units ("u"), left-handed (+X right, +Y up, +Z
# forward), model space relative to the hull centre (the stock feet stand
# at y = -50), unless a field says otherwise. Quaternions (x, y, z, w).
# Read by game/characters/records.rs.

# Section 1: the stock player bodies (US data). `skins` are the upper and
# leg textures per camouflage index (`UpperSkin#`, `LowerSkin#`); only the
# default body's are given by the spec (test case 3), the others are left
# empty until the install's records are read. `faces` is
# `FaceRelationModel#` by face index (-1: keep this record).
[[model]]
id = 0
name = "Normal"
file = "CHARS_M_BODY\\CM_VST_NM_DF_Nuts_JS.ltb"
skeleton = 0
figure = 0
gear = 0
faces = [-1, -1, -1, -1, 7, 7, 7, 7]
upper_skins = [
    "CHARS_T_BODY\\Nomal_vest_body.dtx",
    "CHARS_T_BODY\\Nomal_vest_body_DE.dtx",
    "CHARS_T_BODY\\Nomal_vest_body_SN.dtx",
    "CHARS_T_BODY\\Nomal_vest_body_UR.dtx",
    "CHARS_T_BODY\\Nomal_vest_body_WL.dtx",
    "CHARS_T_BODY\\Nomal_vest_body_FK.dtx",
    "CHARS_T_BODY\\Nomal_vest_body_TG.dtx",
]
lower_skins = [
    "CHARS_T_BODY\\Nomal_vest_leg.dtx",
    "CHARS_T_BODY\\Nomal_vest_leg_DE.dtx",
    "CHARS_T_BODY\\Nomal_vest_leg_SN.dtx",
    "CHARS_T_BODY\\Nomal_vest_leg_UR.dtx",
    "CHARS_T_BODY\\Nomal_vest_leg_WL.dtx",
    "CHARS_T_BODY\\Nomal_vest_leg_FK.dtx",
    "CHARS_T_BODY\\Nomal_vest_leg_TG.dtx",
]

[[model]]
