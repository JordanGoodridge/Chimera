# Test fixture for tests/it/inventory.rs: the stock loadout's pistol with
# what specs/combat_arms/inventory.md's tests need (Constants: stock
# per-weapon data: 15 / 45, draw 650 ms, reload 1500 ms, sprint-out
# 400 ms). Not the game's data: its fire rate and damage are ours.
id = "combat_arms:test_m92fs"
units = { length = 0.018, damage = 0.01 }
slot = 1
draw = 0.65

[ammo."combat_arms:test_9mm"]
max = 30

[trigger]
automatic = false
cycle = 0.18
timing = "set"
# A 0 ms pre-fire: the first round 3 updates after the press
# (inventory.md Corrections 1).
latency = 3

[magazine]
clip = 15
ammo = "combat_arms:test_9mm"
reload = 1.5

[hitscan]
range = 10000.0
pellets = 1
punch_scale = 0.0

[damage]
amount = 20.0
falloff = 1.0
falloff_step = 1.0
hitgroups = { head = 1.0, chest = 1.0, stomach = 1.0, arm = 1.0, leg = 1.0 }
impulse = 0.0

[hooks."combat_arms:inventory"]
sprint_out = 0.4
