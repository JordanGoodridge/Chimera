# Optional. Copy to chimera.local.toml (gitignored) and edit. Machine-specific
# settings that must never be committed: install paths, Combat Arms keys.
# (An old mashup.local.toml is still read when there is no chimera.local.toml.)
#
# The game finds the CS:S install by itself: the path saved by its first-run
# dialog or `chimera_install <folder>` (in the user's settings.toml, beside
# the cfg folder), else Steam's library folders. A path here always wins
# over both. The startup log says which install is used and how it was
# found.

# [games.cs_source]
# Folder containing cstrike/ and hl2/. Steam app 240.
# path = "~/games/counter-strike-source"

# Optional: CS:S dedicated server (Steam app 232330, SteamCMD anonymous)
# with Metamod:Source, SourceMod and the tools/css_probe plugin, for the
# movecmp tool. Keep it separate from the game install.
# [games.cs_source_server]
# path = "~/games/css-ds"

[games.combat_arms]
# Folder containing the game (only with the local Combat Arms loader).
path = "~/games/combat-arms-classic"

# Optional: the asset store (docs/plans/active/asset-service.md; records
# packed by `chimera_pack`, checked with `chimera_assets`). Default: the
# user's cache (~/.cache/chimera/assets, %LOCALAPPDATA%\chimera\assets),
# layered under each install. The environment wins over this section:
# CHIMERA_ASSET_STORE, CHIMERA_ASSET_USE_INSTALL=0/1.
# [assets]
# store = "~/.cache/chimera/assets"
# false: games the store has a manifest for load from it alone (no install
# looked for, no keys needed).
# use_install = true
# The build to mount per game (default: the newest in the store).
# builds = { cs_source = "25338318" }
