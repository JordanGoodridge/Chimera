# Views of cs_assault for benchmarking occluders (docs/performance.md),
# generated from its entities: the first three T and CT spawns,
# looking four ways. Source eye positions; angles [pitch, yaw].
# `pvs_*`: views where the PVS hides props and buildings seen over the
# walls through sky brushes (capture C27, docs/plans/active/parity-gaps.md;
# `refcmp vischeck`'s nav1371, spawn12 and nav2507 views).

map = "cs_assault"
camera = "point_viewcontrol"

