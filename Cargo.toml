# A Cargo workspace (docs/ARCHITECTURE.md, "Crates"): Chimera (chimera/),
# Source's loaders (source/), the games as libraries (games/), the apps
# (apps/) and the tools of each layer; the root package `mashup` holds
# the integration tests. Commands run at the repository root act on every
# default member: `cargo test` tests them all, `cargo test -p
# source_formats` one crate alone, `cargo run` the game (`default-run` of
# apps/cs_source).
[workspace]
members = [
    ".",
    "chimera/core",
    "chimera/dev",
    "chimera/workspace-hack",
    "chimera/world",
    "chimera/present",
    "chimera/sim",
    "chimera/client",
    "chimera/net",
    "chimera/tools",
    "source/formats",
    "source/logic",
    "source/tools",
    "games/cs_source",
    "games/cs_source/tools",
    "apps/cs_source",
    "apps/cs_source_server",
]
default-members = [
    ".",
    "chimera/core",
    "chimera/dev",
    "chimera/workspace-hack",
    "chimera/world",
    "chimera/present",
    "chimera/sim",
    "chimera/client",
    "chimera/net",
    "chimera/tools",
    "source/formats",
    "source/logic",
    "source/tools",
    "games/cs_source",
    "games/cs_source/tools",
    "apps/cs_source",
    "apps/cs_source_server",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

# Dependencies more than one member uses (or may): one version for all.
[workspace.dependencies]
chimera_core = { path = "chimera/core" }
chimera_dev = { path = "chimera/dev" }
# Third-party crates' features unified for every build (`cargo hakari`,
# .config/hakari.toml; chimera/workspace-hack/Cargo.toml).
workspace-hack = { path = "chimera/workspace-hack" }
chimera_world = { path = "chimera/world" }
chimera_present = { path = "chimera/present" }
chimera_sim = { path = "chimera/sim" }
chimera_client = { path = "chimera/client" }
chimera_net = { path = "chimera/net" }
source_formats = { path = "source/formats" }
source_logic = { path = "source/logic" }
cs_source = { path = "games/cs_source" }
# The layers' tools (docs/ARCHITECTURE.md, "Crates"): Chimera's (the
# perf gate, image comparison) and Source's (RCON) libraries, for the
# tools above them.
chimera_tools = { path = "chimera/tools" }
source_tools = { path = "source/tools" }
# The CS:S app's glue; without its default `present` here so the dedicated
# server can leave the presentation out (members that want it turn on
# `present`).
cs_source_app = { path = "apps/cs_source", default-features = false }
avian3d = "0.7"
# serialize: predicted components (Transform among them) travel as serde
# (`core::PredictedAppExt::predicted_net`); `dev` got it through
# bevy_remote, so builds without `dev` (playtest, release) failed.
bevy = { version = "0.19.1", features = ["wav", "serialize"] }
# The server's state of a client's own player, compared with its prediction
# byte for byte (core::PredictedComponents::encode); replicon's format.
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
# Per-thread hardware counters (instructions, cycles, cache and branch
# misses) for `metrics`; Linux only, elsewhere the metrics say
# "unavailable".
perf-event2 = "0.7.4"
# Per-thread CPU time (`clock_gettime(CLOCK_THREAD_CPUTIME_ID)`).
libc = "0.2"
# Networking (docs/plans/active/multiplayer.md): replication over renet's
# netcode UDP transport.
bevy_replicon = { version = "0.44.3", default-features = false, features = ["client", "server"] }
bevy_replicon_renet = "0.20.0"
renetcode = "2.0"
igd-next = { version = "0.18", default-features = false, features = ["io_sync"] }
half = "2.7.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga"] }
# Bevy's math types (`bevy::math::Vec3` is `glam::Vec3`): the version
# bevy_math 0.19 uses, so a format crate's vectors are the game's.
glam = "0.32"
# LZMA-compressed BSP lumps and pakfile entries (bspzip -repack; vbsp
# already depends on it).
lzma-rs = "0.3"
# The user's folders (mount::install's settings, captures).
dirs = "7.0.0"
toml = "1.1.6"
# Where Steam is (`HKCU\Software\Valve\Steam` `SteamPath`) for finding the
# CS:S install (chimera_core's mount::install); already in the tree
# through winit.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
# Source's maps, models and materials (`cs_source`'s loaders; `dump`,
# `refcmp`), compressed downloads and the map file's hash.
vbsp = "0.9"
vmdl = "0.2"
vmt-parser = "0.2"
vtf = "0.4"
bzip2 = "0.6.1"
sha2 = "0.10"
# MP3 sounds packed in community maps (music, minigame sounds).
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }
# HUD glyphs rasterized and placed as Source's HUD does (chimera_client's
# `hud_text`).
ab_glyph = "0.2.32"
# The client shell's debug UI and inspector (chimera_client); egui drawn
# over Bevy's UI (the debug UI over the HUD).
bevy-inspector-egui = "0.37"
bevy_egui = { version = "0.40", default-features = false, features = ["bevy_ui"] }
# Copy and paste (the console, the front end's text fields).
arboard = "3.6"
serde_json = "1.0.151"
# The window icon (`winit::window::Icon`; the winit bevy_winit uses).
winit = { version = "0.30", default-features = false }

[package]
name = "mashup"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# `mashup`, the repository root's package, is now a thin shim: the CS:S
# app's glue (`cs_source_app`, apps/cs_source) re-exported at the old
# `mashup::` paths (src/lib.rs), for the one integration test crate
# (tests/it/, which tests across the whole workspace), `dump` (an install
# inspector for several games) and Combat Arms' local code
# (src/games/combat_arms/, git-ignored). The game binary is the app's,
# the dedicated server apps/cs_source_server's, the tools their layers'
# (docs/ARCHITECTURE.md, "Crates").
[lib]
doctest = false

[dependencies]
cs_source_app.workspace = true
cs_source.workspace = true
source_formats.workspace = true
avian3d.workspace = true
bevy.workspace = true
bevy_replicon.workspace = true
bevy_replicon_renet.workspace = true
postcard.workspace = true
bzip2.workspace = true
dirs.workspace = true
half.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
twofish = { version = "0.8", optional = true }
vbsp.workspace = true
vmdl.workspace = true
vmt-parser.workspace = true
vtf.workspace = true
workspace-hack.workspace = true

[dev-dependencies]
# Checksums of files read through the mount (tests/it/mount_cs_source.rs).
crc32fast = "1.5.2"

# Binaries without unit tests: `cargo test` skips building a test harness
# of each (one more link apiece). A binary that gets tests loses its
# `test = false`; tests/it/architecture.rs checks this in every member.
[[bin]]
name = "dump"
test = false

# The integration tests (tests/it/) drive the game with its presentation.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["present"]

[features]
default = ["present"]

# The app with its presentation, client shell and CS:S's front end
# (`cs_source_app`'s `present`): what the integration tests drive.
present = ["cs_source_app/present"]

# Combat Arms loader: developed locally, git-ignored (src/games/combat_arms/).
# Enable with --features combat_arms where that folder exists.
combat_arms = ["dep:twofish"]

# Faster iteration: link Bevy as a dynamic library (the app's `dev` and
# every crate's under it). Never enable for release builds.
dev = ["cs_source_app/dev"]

# CPU profile: every system and render step as a span in a Chrome trace
# (docs/performance.md). Slower; only for measuring.
profile = ["cs_source_app/profile"]

# Our own code: a little optimization so the game is playable in debug.
[profile.dev]
opt-level = 1

# Dependencies (Bevy, parsers): fully optimized, compiled once and cached.
[profile.dev.package."*"]
opt-level = 3

# Build scripts, proc macros and their dependencies: no debuginfo, always.
# Left to cargo, a build-time dependency keeps debuginfo only when a
# runtime dependency shares it, so `cargo test -p <crate>` (fewer runtime
# dependencies) built every proc macro again, and Bevy after them, for
# all the workspace-hack's unified features (docs/performance.md,
# "Workspace-hack").
[profile.dev.build-override]
debug = false

[profile.release]
codegen-units = 1
lto = "thin"

# Fast-to-rebuild optimized build for playtesting (e.g. on the Windows PC):
# release speed without LTO's long link.
[profile.playtest]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
