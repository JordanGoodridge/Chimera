# A Cargo workspace (docs/ARCHITECTURE.md, "Crates"): the game itself
# (`mashup`, this package) and the crates cut out of it. Commands run at
# the repository root act on every default member: `cargo test` tests
# them all, `cargo test -p source_formats` one crate alone.
[workspace]
members = [".", "source/formats"]
default-members = [".", "source/formats"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

# Dependencies more than one member uses (or may): one version for all.
[workspace.dependencies]
source_formats = { path = "source/formats" }
# Bevy's math types (`bevy::math::Vec3` is `glam::Vec3`): the version
# bevy_math 0.19 uses, so a format crate's vectors are the game's.
glam = "0.32"
# LZMA-compressed BSP lumps and pakfile entries (bspzip -repack; vbsp
# already depends on it).
lzma-rs = "0.3"
# MP3 sounds packed in community maps (music, minigame sounds).
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }

[package]
name = "mashup"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
default-run = "mashup"

[dependencies]
# The file formats (VPK, pakfile, KeyValues and .res, DMX/PCF, nav, ...):
# pure data, no Bevy (source/formats).
source_formats.workspace = true
avian3d = "0.7"
# serialize: predicted components (Transform among them) travel as serde
# (`core::PredictedAppExt::predicted_net`); `dev` got it through
# bevy_remote, so builds without `dev` (playtest, release) failed.
bevy = { version = "0.19.1", features = ["wav", "serialize"] }
bevy-inspector-egui = "0.37"
# The inspector's egui, with egui drawn over Bevy's UI (the debug UI over the HUD).
bevy_egui = { version = "0.40", default-features = false, features = ["bevy_ui"] }
# Networking (docs/plans/active/multiplayer.md): replication over renet's
# netcode UDP transport.
bevy_replicon = { version = "0.44.3", default-features = false, features = ["client", "server"] }
bevy_replicon_renet = "0.20.0"
# Netcode's client protocol, for our UDP client transport with
# `net_fakelag`/`net_fakeloss` (net::udp); the one bevy_replicon_renet uses.
renetcode = "2.0"
# UPnP port mapping for hosts (`net_upnp`, net::upnp); sync client, no TLS.
igd-next = { version = "0.18", default-features = false, features = ["io_sync"] }
# The server's state of a client's own player, compared with its prediction
# byte for byte (core::PredictedComponents::encode); replicon's format.
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
bzip2 = "0.6.1"
# HUD glyphs rasterized and placed as Source's HUD does (client::hud_text).
ab_glyph = "0.2.32"
arboard = "3.6"
crc32fast = "1.5.2"
dirs = "7.0.0"
half = "2.7.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga"] }
# The window icon (`winit::window::Icon`; the winit bevy_winit uses).
winit = { version = "0.30", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The map file's hash in the connect handshake.
sha2 = "0.10"
toml = "1.1.6"
twofish = { version = "0.8", optional = true }
vbsp = "0.9"
vmdl = "0.2"
vmt-parser = "0.2"
vtf = "0.4"

# Per-thread hardware counters (instructions, cycles, cache and branch
# misses) for `metrics`; Linux only, elsewhere the metrics say
# "unavailable".
[target.'cfg(target_os = "linux")'.dependencies]
perf-event2 = "0.7.4"

# Per-thread CPU time (`clock_gettime(CLOCK_THREAD_CPUTIME_ID)`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Where Steam is (`HKCU\Software\Valve\Steam` `SteamPath`) for finding the
# CS:S install (mount::install); already in the tree through winit.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

# Binaries without unit tests: `cargo test` skips building a test harness
# of each (one more link of the game apiece). A binary that gets tests
# loses its `test = false`; tests/it/architecture.rs checks this.
[[bin]]
name = "mashup"
path = "src/main.rs"
test = false

[[bin]]
name = "dump"
test = false

# Binaries no test runs are built only with a feature (`required-features`):
# cargo builds every binary of the package for its integration tests, so
# without one each would relink the whole game on every `cargo test`
# (docs/performance.md, "Test cycle"). The pre-push hook checks them with
# `cargo check --lib --bins --features tools,server`.

# The dedicated server: the simulation and `net`, no window
# (`cargo run --features server --bin mashup_server`).
[[bin]]
name = "mashup_server"
test = false
required-features = ["server"]

# Debugging tools (docs/OBSERVABILITY.md): `--features tools`.
[[bin]]
name = "movecmp"
test = false
required-features = ["tools"]

[[bin]]
name = "refcmp"
test = false
required-features = ["tools"]

[[bin]]
name = "tracesum"
test = false
required-features = ["tools"]

# Instructions-per-tick regression gate (docs/performance.md).
[[bin]]
name = "perfgate"
test = false
required-features = ["tools"]

[[bin]]
name = "mapsweep"
test = false
required-features = ["tools"]

[features]
# The debugging binaries (refcmp, movecmp, perfgate, tracesum, mapsweep).
tools = []

# The dedicated server binary (mashup_server).
server = []

# Combat Arms loader: developed locally, git-ignored (src/games/combat_arms/).
# Enable with --features combat_arms where that folder exists.
combat_arms = ["dep:twofish"]

# Faster iteration: link Bevy as a dynamic library. Use with
# `cargo run --features dev`. Never enable for release builds.
dev = ["bevy/dynamic_linking", "bevy/bevy_remote"]

# CPU profile: every system and render step as a span in a Chrome trace
# (trace-<time>.json, open in https://ui.perfetto.dev). See
# docs/performance.md. Slower; only for measuring.
profile = ["bevy/trace_chrome"]

# Our own code: a little optimization so the game is playable in debug.
[profile.dev]
opt-level = 1

# Dependencies (Bevy, parsers): fully optimized, compiled once and cached.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Fast-to-rebuild optimized build for playtesting (e.g. on the Windows PC):
# release speed without LTO's long link.
[profile.playtest]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
